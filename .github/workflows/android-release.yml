# ============================================================
# HangUpFX — Android Release Build (Signed AAB)
# ============================================================
#
# This workflow builds a production-ready, signed Android App
# Bundle (.AAB) for Google Play Console submission.
#
# Triggers:
#   - Push to `main` branch
#   - Manual dispatch (workflow_dispatch)
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64    — Base64-encoded upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  — Keystore password
#   ANDROID_KEY_ALIAS          — Key alias (e.g., "hangupfx-upload")
#   ANDROID_KEY_PASSWORD       — Key password
#
# Output:
#   Signed .AAB uploaded as a downloadable workflow artifact.
#
# ============================================================

name: Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g., 1.2.0). Leave empty to use package.json version."
        required: false
        default: ""
      version_code:
        description: "Version code (integer). Leave empty to auto-increment from run number."
        required: false
        default: ""

# Cancel in-progress runs for the same branch
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  ANDROID_COMPILE_SDK: "35"
  ANDROID_TARGET_SDK: "35"
  ANDROID_MIN_SDK: "26"
  ANDROID_BUILD_TOOLS: "35.0.0"
  APP_PACKAGE_NAME: "com.hangupfx.app"

jobs:
  build-android-aab:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
             
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build web (skip if missing)
        run: npm run build --if-present
        env:
          NODE_ENV: production

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "platform-tools"

      - name: Ensure Capacitor CLI is available
        run: npm i -D @capacitor/cli @capacitor/core

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already exists"
          fi

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/hangupfx-upload.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/app/hangupfx-upload.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: HangUpFX-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
