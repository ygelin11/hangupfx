name: Android Release (Signed AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  CI: "true"
  CAP_APP_ID: "com.ygelin11.hangupfx"
  CAP_APP_NAME: "HangUpFX"

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Capacitor deps exist
        run: |
          set -euo pipefail
          npm install --no-save @capacitor/cli @capacitor/core @capacitor/android

      - name: Export web assets (Expo -> dist)
        run: |
          set -euo pipefail
          npx --yes expo export --platform web --output-dir dist
          test -f dist/index.html

      - name: Ensure capacitor.config.json (locked appId + webDir)
        run: |
          set -euo pipefail
          python3 -c "import json,os,pathlib,sys; app_id=os.environ['CAP_APP_ID']; app_name=os.environ['CAP_APP_NAME']; webdir='dist'; idx=pathlib.Path(webdir)/'index.html'; \
          idx.exists() or (print(f'ERROR: {webdir}/index.html missing', file=sys.stderr) or sys.exit(1)); \
          p=pathlib.Path('capacitor.config.json'); \
          data={}; \
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}; \
          data['appId']=app_id; data['appName']=app_name; data['webDir']=webdir; data.setdefault('bundledWebRuntime', False); \
          p.write_text(json.dumps(data, indent=2)+'\n', encoding='utf-8')"

      - name: Recreate Capacitor Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set up Java (JDK 17) + Gradle cache (android/)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/gradle-wrapper.properties
            android/**/build.gradle*
            android/**/settings.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (API 34) + accept licenses
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode upload keystore to android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}"
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -f android/app/upload-keystore.jks

      - name: Write keystore.properties for Gradle (android/keystore.properties)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${ANDROID_KEY_ALIAS:-}"
          test -n "${ANDROID_KEY_PASSWORD:-}"
          printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/keystore.properties

      - name: Create CI Gradle init signing script (base64 safe)
        run: |
          set -euo pipefail
          mkdir -p android
          echo "" | base64 --decode > android/ci-signing.init.gradle
          test -f android/ci-signing.init.gradle
          echo "Init script created ✅"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Signed Release AAB (capture log + show tail on failure)
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --version

          set +e
          ./gradlew -I ci-signing.init.gradle --no-daemon --stacktrace --info clean :app:bundleRelease 2>&1 | tee ../gradle-build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "================= GRADLE FAILED (last 250 lines) ================="
            tail -n 250 ../gradle-build.log || true
            echo "==================================================================="
            exit "$STATUS"
          fi

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Verify AAB is signed (jarsigner)
        run: |
          set -euo pipefail
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          jarsigner -verify -verbose -certs "$AAB_PATH"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
