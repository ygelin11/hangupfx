name: Android Release Build
  
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-aab:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build web (skip if missing)
        run: npm run build --if-present
        env:
          NODE_ENV: production

      - name: Install Capacitor (CLI + Android)
        run: npm i -D @capacitor/core @capacitor/cli @capacitor/android

      - name: Ensure capacitor.config.json exists (minimal)
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "Creating capacitor.config.json"
            echo '{"appId":"com.example.app","appName":"HangUpFX","webDir":"dist","bundledWebRuntime":false}' > capacitor.config.json
          else
            echo "capacitor.config.json exists"
          fi

      - name: Add Capacitor Android platform
        run: npx cap add android || true

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Decode upload keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf "\nMYAPP_UPLOAD_STORE_FILE=upload-keystore.jks" >> app/gradle.properties
          printf "\nMYAPP_UPLOAD_STORE_PASSWORD=%s" "$ANDROID_STORE_PASSWORD" >> app/gradle.properties
          printf "\nMYAPP_UPLOAD_KEY_ALIAS=%s" "$ANDROID_KEY_ALIAS" >> app/gradle.properties
          printf "\nMYAPP_UPLOAD_KEY_PASSWORD=%s\n" "$ANDROID_KEY_PASSWORD" >> app/gradle.properties
          ./gradlew --no-daemon bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangupfx-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

