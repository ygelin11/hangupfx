name: Android Release (Signed AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  CI: "true"

  # LOCKED package name (matches app.json and Play Console forever)
  CAP_APP_ID: "com.ygelin11.hangupfx"
  CAP_APP_NAME: "HangUpFX"

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Capacitor deps exist (CI-stable)
        run: |
          set -euo pipefail
          npm install --no-save @capacitor/cli @capacitor/core @capacitor/android

      - name: Build web assets for Capacitor (Expo export -> dist)
        run: |
          set -euo pipefail
          # Famous/Expo projects often need export, not "build"
          # Output must contain dist/index.html for Capacitor webDir
          npx --yes expo export --platform web --output-dir dist
          test -f dist/index.html
          ls -la dist | head -n 50

      - name: Ensure capacitor.config.json (appId/appName/webDir)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys

          app_id = os.environ["CAP_APP_ID"]
          app_name = os.environ["CAP_APP_NAME"]
          webdir = "dist"

          idx = pathlib.Path(webdir) / "index.html"
          if not idx.exists():
            print(f"ERROR: {webdir}/index.html missing; web export failed", file=sys.stderr)
            sys.exit(1)

          p = pathlib.Path("capacitor.config.json")
          data = {}
          if p.exists():
            try:
              data = json.loads(p.read_text(encoding="utf-8"))
            except Exception:
              data = {}

          data["appId"] = app_id
          data["appName"] = app_name
          data["webDir"] = webdir
          data.setdefault("bundledWebRuntime", False)

          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("capacitor.config.json ready:", data["appId"], data["webDir"])
          PY

      - name: Recreate Capacitor Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap --version
          npx cap add android
          npx cap sync android

      - name: Set up Java (JDK 21) + Gradle cache (android/)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/gradle-wrapper.properties
            android/**/build.gradle*
            android/**/settings.gradle*

      - name: Decode upload keystore to android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -f android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks

      - name: Write keystore.properties for Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Missing one or more signing secrets: ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi

          printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/keystore.properties

          sed -e 's/storePassword=.*/storePassword=***REDACTED***/' \
              -e 's/keyPassword=.*/keyPassword=***REDACTED***/' android/keystore.properties

      - name: Ensure release signing uses upload-keystore.jks (no app/app path issues)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          bg = pathlib.Path("android/app/build.gradle")
          if not bg.exists():
            print("ERROR: android/app/build.gradle not found", file=sys.stderr)
            sys.exit(1)

          s = bg.read_text(encoding="utf-8")

          # Add keystore loader if missing
          if "keystorePropertiesFile" not in s:
            loader = (
              "def keystorePropertiesFile = rootProject.file('keystore.properties')\n"
              "def keystoreProperties = new Properties()\n"
              "if (keystorePropertiesFile.exists()) {\n"
              "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
              "}\n\n"
            )
            s = loader + s

          # Force storeFile to local android/app/upload-keystore.jks
          s = re.sub(r"storeFile\s+file\([^\)]*\)", "storeFile file('upload-keystore.jks')", s)

          # Ensure signingConfigs.release exists inside android { }
          if "signingConfigs" not in s:
            m = re.search(r"(\bandroid\s*\{\s*)", s)
            if not m:
              print("ERROR: android { } block not detected in build.gradle", file=sys.stderr)
              sys.exit(1)
            s = re.sub(
              r"(\bandroid\s*\{\s*)",
              r"\\1\n    signingConfigs {\n        release {\n            if (keystorePropertiesFile.exists()) {\n                storeFile file('upload-keystore.jks')\n                storePassword keystoreProperties['storePassword']\n                keyAlias keystoreProperties['keyAlias']\n                keyPassword keystoreProperties['keyPassword']\n            }\n        }\n    }\n",
              s,
              count=1
            )

          # Ensure buildTypes.release uses signingConfigs.release
          if "signingConfig signingConfigs.release" not in s:
            s = re.sub(
              r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
              r"\\1\n            signingConfig signingConfigs.release",
              s,
              count=1
            )

          bg.write_text(s, encoding="utf-8")
          print("Release signing ensured.")
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Signed Release AAB
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean bundleRelease
          ls -la app/build/outputs/bundle/release || true

      - name: Verify AAB is signed (jarsigner)
        run: |
          set -euo pipefail
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found at $AAB_PATH" >&2
            find android/app/build/outputs -maxdepth 6 -type f -name "*.aab" -print || true
            exit 1
          fi
          jarsigner -verify -verbose -certs "$AAB_PATH"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping (if present)
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
