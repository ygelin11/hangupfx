name: Android Release (Signed AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  CI: "true"
  # Set these to your real values (safe defaults here so CI can bootstrap)
  CAP_APP_ID: "com.example.hangupfx"
  CAP_APP_NAME: "HangUpFX"

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Capacitor config exists and has appId
        run: |
          set -euo pipefail

          # Create capacitor.config.json if missing
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF'
{
  "appId": "__APP_ID__",
  "appName": "__APP_NAME__",
  "webDir": "dist",
  "bundledWebRuntime": false
}
EOF
          fi

          # Ensure appId/appName exist (patch in place)
          python3 - <<'PY'
          import json, os, pathlib, sys

          p = pathlib.Path("capacitor.config.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          app_id = os.environ.get("CAP_APP_ID", "com.example.hangupfx")
          app_name = os.environ.get("CAP_APP_NAME", "HangUpFX")

          # If placeholders exist, replace them
          if data.get("appId") in (None, "", "__APP_ID__"):
            data["appId"] = app_id
          if data.get("appName") in (None, "", "__APP_NAME__"):
            data["appName"] = app_name

          # Ensure webDir exists key (Expo web build output varies; dist is common)
          if not data.get("webDir"):
            data["webDir"] = "dist"

          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("capacitor.config.json ensured with appId/appName/webDir")
          print(f"appId={data['appId']}")
          print(f"appName={data['appName']}")
          print(f"webDir={data['webDir']}")
          PY

      - name: Build web (if present)
        run: npm run build --if-present

      - name: Ensure Capacitor Android dependencies exist (CI-stable)
        run: |
          set -euo pipefail
          # Install locally for this CI run (does not commit anything back)
          npm install --no-save @capacitor/cli @capacitor/core @capacitor/android

      - name: Recreate Capacitor Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap --version
          npx cap add android
          npx cap sync android

      - name: Set up Java (JDK 21) + Gradle cache (android/)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/gradle-wrapper.properties
            android/**/build.gradle*
            android/**/settings.gradle*
            android/gradle/*.versions.toml
            android/**/versions.properties
            android/buildSrc/**/Versions.kt
            android/buildSrc/**/Dependencies.kt

      - name: Decode upload keystore to android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -f android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks

      - name: Write keystore.properties for Gradle (safe)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Missing one or more signing secrets: ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi

          printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/keystore.properties

          echo "keystore.properties created at android/keystore.properties"
          sed -e 's/storePassword=.*/storePassword=***REDACTED***/' \
              -e 's/keyPassword=.*/keyPassword=***REDACTED***/' android/keystore.properties

      - name: Force release signing config (no app/app path issues)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          bg = pathlib.Path("android/app/build.gradle")
          if not bg.exists():
            print("ERROR: android/app/build.gradle not found", file=sys.stderr)
            sys.exit(1)

          s = bg.read_text(encoding="utf-8")

          if "keystorePropertiesFile" not in s:
            loader = (
              'def keystorePropertiesFile = rootProject.file("keystore.properties")\n'
              'def keystoreProperties = new Properties()\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
            )
            s = loader + s

          # Force storeFile to be local to android/app/
          s = re.sub(r"storeFile\s+file\([^\)]*\)", 'storeFile file("upload-keystore.jks")', s)

          def has_release_signing(text: str) -> bool:
            return ("signingConfigs" in text) and ("buildTypes" in text) and ("signingConfig" in text)

          if has_release_signing(s):
            if re.search(r"buildTypes\s*\{[\s\S]*?release\s*\{", s) and "signingConfig signingConfigs.release" not in s:
              s = re.sub(
                r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
                r"\1\n            signingConfig signingConfigs.release",
                s,
                count=1
              )
            bg.write_text(s, encoding="utf-8")
            print("Patched existing signing config and ensured release uses signingConfigs.release.")
            sys.exit(0)

          m = re.search(r"\bandroid\s*\{", s)
          if not m:
            print("ERROR: android { } block not detected in build.gradle", file=sys.stderr)
            sys.exit(1)

          s = re.sub(
            r"(\bandroid\s*\{\s*)",
            r"\1\n    signingConfigs {\n        release {\n            if (keystorePropertiesFile.exists()) {\n                storeFile file(\"upload-keystore.jks\")\n                storePassword keystoreProperties['storePassword']\n                keyAlias keystoreProperties['keyAlias']\n                keyPassword keystoreProperties['keyPassword']\n            }\n        }\n    }\n",
            s,
            count=1
          )

          if "buildTypes" in s and "signingConfig signingConfigs.release" not in s:
            s = re.sub(
              r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              s,
              count=1
            )

          bg.write_text(s, encoding="utf-8")
          print("Injected signing config into build.gradle for CI-stable release signing.")
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Signed Release AAB
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean bundleRelease
          ls -la app/build/outputs/bundle/release || true

      - name: Verify AAB is signed (jarsigner)
        run: |
          set -euo pipefail
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found at $AAB_PATH" >&2
            find android/app/build/outputs -maxdepth 6 -type f -name "*.aab" -print || true
            exit 1
          fi
          echo "Verifying signature on: $AAB_PATH"
          jarsigner -verify -verbose -certs "$AAB_PATH"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping (if present)
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
