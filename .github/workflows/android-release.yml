name: Android Release (Signed AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  CI: "true"

  CAP_APP_ID: "com.ygelin11.hangupfx"
  CAP_APP_NAME: "HangUpFX"

  # Kotlin alignment to stop DuplicateClasses errors
  KOTLIN_STDLIB_VERSION: "1.8.22"

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Capacitor deps exist
        run: |
          set -euo pipefail
          npm install --no-save @capacitor/cli @capacitor/core @capacitor/android

      - name: Export web assets (Expo -> dist)
        run: |
          set -euo pipefail
          npx --yes expo export --platform web --output-dir dist
          test -f dist/index.html

      - name: Ensure capacitor.config.json (locked appId + webDir)
        run: |
          set -euo pipefail
          python3 -c "import json,os,pathlib,sys; app_id=os.environ['CAP_APP_ID']; app_name=os.environ['CAP_APP_NAME']; webdir='dist'; \
          idx=pathlib.Path(webdir)/'index.html'; idx.exists() or (print(f'ERROR: {webdir}/index.html missing', file=sys.stderr) or sys.exit(1)); \
          p=pathlib.Path('capacitor.config.json'); data={}; \
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}; \
          data['appId']=app_id; data['appName']=app_name; data['webDir']=webdir; data.setdefault('bundledWebRuntime', False); \
          p.write_text(json.dumps(data, indent=2)+'\n', encoding='utf-8')"

      - name: Recreate Capacitor Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch Gradle to fix Kotlin duplicate classes (force stdlib + exclude jdk7/jdk8)
        env:
          KOTLIN_STDLIB_VERSION: ${{ env.KOTLIN_STDLIB_VERSION }}
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; import os, sys; \
          p=Path('android/build.gradle'); \
          p.exists() or (print('ERROR: android/build.gradle not found', file=sys.stderr) or sys.exit(1)); \
          s=p.read_text(encoding='utf-8'); \
          marker='// CI_KOTLIN_DUPLICATE_FIX'; \
          fix=(f\"\\n{marker}\\n\" \
               f\"allprojects {{\\n\" \
               f\"  configurations.all {{\\n\" \
               f\"    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\\n\" \
               f\"    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\\n\" \
               f\"    resolutionStrategy.eachDependency {{ details ->\\n\" \
               f\"      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {{\\n\" \
               f\"        details.useVersion('{os.environ['KOTLIN_STDLIB_VERSION']}')\\n\" \
               f\"        details.because('CI: align Kotlin stdlib to avoid duplicate classes')\\n\" \
               f\"      }}\\n\" \
               f\"    }}\\n\" \
               f\"  }}\\n\" \
               f\"}}\\n\"); \
          p.write_text(s if marker in s else (s+fix), encoding='utf-8')"

      - name: Set up Java (JDK 21) + Gradle cache (android/)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/gradle-wrapper.properties
            android/**/build.gradle*
            android/**/settings.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (API 34) + accept licenses
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode upload keystore (android/app/upload-keystore.jks)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -f android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Signed Release AAB (injected signing)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Missing one or more signing secrets (password/alias/key password)" >&2
            exit 1
          fi

          STORE_FILE="${GITHUB_WORKSPACE}/android/app/upload-keystore.jks"
          if [ ! -f "$STORE_FILE" ]; then
            echo "Keystore missing at $STORE_FILE" >&2
            ls -la "${GITHUB_WORKSPACE}/android/app" || true
            exit 1
          fi

          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew --version

          set +e
          ./gradlew --no-daemon --stacktrace --info clean :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            2>&1 | tee ../gradle-build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "================= GRADLE FAILED (last 250 lines) ================="
            tail -n 250 ../gradle-build.log || true
            echo "==================================================================="
            exit "$STATUS"
          fi

          ls -la app/build/outputs/bundle/release || true

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Verify AAB is signed (jarsigner)
        run: |
          set -euo pipefail
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found at $AAB_PATH" >&2
            find android/app/build/outputs -maxdepth 6 -type f -name "*.aab" -print || true
            exit 1
          fi
          jarsigner -verify -verbose -certs "$AAB_PATH"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
