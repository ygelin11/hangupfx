name: Android Release Build
  
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-aab:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build web (skip if missing)
        run: npx expo export --platform web --output-dir dist
        env:
          NODE_ENV: production

      - name: Install Capacitor (CLI + Android)
        run: npm i -D @capacitor/core @capacitor/cli @capacitor/android

      - name: Ensure capacitor.config.json exists (minimal)
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "Creating capacitor.config.json"
            echo '{"appId":"com.example.app","appName":"HangUpFX","webDir":"dist","bundledWebRuntime":false}' > capacitor.config.json
          else
            echo "capacitor.config.json exists"
          fi

      
      - name: Add Capacitor Android platform
        run: |
               rm -rf android
               npx cap add android
               npx cap sync android

 

      
      - name: Decode upload keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew || true


      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf "\nMYAPP_UPLOAD_STORE_FILE=upload-keystore.jks" >> app/gradle.properties


          printf "\nMYAPP_UPLOAD_STORE_PASSWORD=%s" "$ANDROID_STORE_PASSWORD" >> app/gradle.properties


          printf "\nMYAPP_UPLOAD_KEY_ALIAS=%s" "$ANDROID_KEY_ALIAS" >> app/gradle.properties

          printf "\nMYAPP_UPLOAD_KEY_PASSWORD=%s\n" "$ANDROID_KEY_PASSWORD" >> app/gradle.properties


                       cat > force-kotlin.gradle <<'EOF'
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin" &&
                          details.requested.name.startsWith("kotlin-stdlib")) {
                          details.useVersion "1.8.22"
                          details.because "Avoid duplicate Kotlin stdlib classes from mixed versions"
                      }
                  }
              }
          }
          EOF

          
             ./gradlew --no-daemon bundleRelease -Pkotlin.stdlib.default.dependency=false -I force-kotlin.gradle
 



      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangupfx-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

