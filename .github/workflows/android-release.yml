name: Android Release (Signed AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  CI: "true"

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Temurin JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (if present)
        run: npm run build --if-present

      - name: Recreate Capacitor Android platform
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Decode keystore to android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -f android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks

      - name: Create android/keystore.properties for Gradle (no heredoc)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Missing signing secrets (password/alias/key password)" >&2
            exit 1
          fi

          # Write keystore.properties safely (avoid YAML heredoc issues)
          printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/keystore.properties

          echo "Created android/keystore.properties (passwords redacted below):"
          sed -e 's/storePassword=.*/storePassword=***REDACTED***/' \
              -e 's/keyPassword=.*/keyPassword=***REDACTED***/' android/keystore.properties

      - name: Ensure release signing config uses android/app/upload-keystore.jks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          bg = pathlib.Path("android/app/build.gradle")
          if not bg.exists():
            print("ERROR: android/app/build.gradle not found", file=sys.stderr)
            sys.exit(1)

          s = bg.read_text(encoding="utf-8")

          # Ensure keystore properties loader exists near top
          if "keystorePropertiesFile" not in s:
            loader = (
              'def keystorePropertiesFile = rootProject.file("keystore.properties")\n'
              'def keystoreProperties = new Properties()\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
            )
            s = loader + s

          # Force storeFile reference to local file in android/app/
          s = re.sub(r"storeFile\s+file\([^\)]*\)", 'storeFile file("upload-keystore.jks")', s)

          # If signingConfigs.release doesn't exist, inject it right after android {
          if "signingConfigs" not in s:
            s = re.sub(
              r"(\bandroid\s*\{\s*)",
              r'\1\n    signingConfigs {\n'
              r'        release {\n'
              r'            if (keystorePropertiesFile.exists()) {\n'
              r'                storeFile file("upload-keystore.jks")\n'
              r"                storePassword keystoreProperties['storePassword']\n"
              r"                keyAlias keystoreProperties['keyAlias']\n"
              r"                keyPassword keystoreProperties['keyPassword']\n"
              r'            }\n'
              r'        }\n'
              r'    }\n',
              s,
              count=1
            )

          # Ensure buildTypes.release uses signingConfigs.release
          if re.search(r"buildTypes\s*\{", s) and "signingConfig signingConfigs.release" not in s:
            s = re.sub(
              r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              s,
              count=1
            )

          bg.write_text(s, encoding="utf-8")
          print("Release signing config ensured (storeFile=upload-keystore.jks; buildTypes.release uses signingConfigs.release).")
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed release AAB
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean bundleRelease
          ls -la app/build/outputs/bundle/release

      - name: Verify signing (jarsigner)
        run: |
          set -euo pipefail
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          echo "Verifying signature on $AAB_PATH"
          jarsigner -verify -verbose -certs "$AAB_PATH"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping (if present)
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
